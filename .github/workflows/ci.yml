name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true

      # vcpkg 引导：win-x64-ci preset 的 CMAKE_TOOLCHAIN_FILE 引用 $env{VCPKG_ROOT}，
      # runner 上无预置 vcpkg，必须由本 action 克隆并导出 VCPKG_ROOT，否则 configure 失败。
      - name: Bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 98d7cb0cf1f4686a3e43aa5672b6230c1d56bce8

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/out/build/win-x64-ci/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        env:
          # install-qt-action 的 qt_dir 已指向 <qt_host_path>\lib\cmake\Qt6，不可再追加后缀
          Qt6_DIR: ${{ steps.qt.outputs.qt_dir }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset win-x64-ci

      - name: Build
        run: cmake --build --preset win-x64-ci --parallel

      - name: Test
        run: ctest --preset win-x64-ci

  installer:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://jrsoftware.org/download.php/is.exe' -OutFile "$env:RUNNER_TEMP\is.exe" -UseBasicParsing
          Start-Process "$env:RUNNER_TEMP\is.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          echo "ISCC=${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" >> $env:GITHUB_ENV

      - name: Bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 98d7cb0cf1f4686a3e43aa5672b6230c1d56bce8

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/out/build/win-x64-ci/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build installer (windeployqt + Inno)
        shell: pwsh
        env:
          Qt6_DIR: ${{ steps.qt.outputs.qt_dir }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          # windeployqt 位于 qt_bin；入 PATH 后 build-installer.ps1 能直接定位
          echo "${{ steps.qt.outputs.qt_bin }}" >> $env:GITHUB_PATH
          $env:PATH = "${{ steps.qt.outputs.qt_bin }};" + $env:PATH
          .\scripts\build-installer.ps1 -Preset win-x64-ci

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwpanel-setup
          path: out/packages/*.exe

  service-smoke:
    # M3/M6 运行时验收：windows-latest runner 具备管理员权限，可真实注册/恢复/卸载服务
    needs: installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: hwpanel-setup
          path: out/packages

      - name: Install via setup (M6 install path, registers + starts service)
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'out\packages\*.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait

      - name: M3 service smoke (running/eventlog/recover<=30s/pause/continue)
        shell: pwsh
        run: .\scripts\smoke-service.ps1

      - name: Uninstall via setup (M6 cleanup path) + residue assert
        shell: pwsh
        run: |
          $un = Get-ChildItem "$env:ProgramFiles\HWPanel\unins000.exe","${env:ProgramFiles(x86)}\HWPanel\unins000.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $un) { throw 'uninstaller not found' }
          Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          if (Get-Service HWPanelService -ErrorAction SilentlyContinue) { throw 'service residue after uninstall' }
          Write-Host 'uninstall clean'
