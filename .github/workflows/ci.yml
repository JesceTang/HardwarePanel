name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSVC 环境：win-x64-ci 用 Ninja 生成器，需要 cl.exe/ninja/cmake 在 PATH。
      # GitHub runner 的 pwsh 步骤默认无 MSVC 环境（本地实测 CL_ON_BARE_PATH=NO），
      # msvc-dev-cmd 等价于跑 vcvars64.bat，一次性注入 cl/ninja/cmake，否则 configure 找不到编译器。
      - name: Setup MSVC environment (vcvars)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true

      # vcpkg 引导：win-x64-ci preset 的 CMAKE_TOOLCHAIN_FILE 引用 $env{VCPKG_ROOT}，
      # runner 上无预置 vcpkg，必须由本 action 克隆并导出 VCPKG_ROOT，否则 configure 失败。
      - name: Bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # 钉到 microsoft/vcpkg 官方 release 2026.07.29 的 commit（上游真实存在，且最接近本地验证版本）。
          # 注：此前误用了本地镜像 zip 内嵌的 hash，该 hash 在上游 microsoft/vcpkg 不存在（API 返回 422），
          # 导致 run-vcpkg 无法 checkout 而 Bootstrap vcpkg 步骤失败。
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          # 显式钉住克隆目录，与下面 Configure 步骤注入的 VCPKG_ROOT 保持一致（避免 action 默认值漂移）
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/out/build/win-x64-ci/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        env:
          # install-qt-action 的 qt_dir 已指向 <qt_host_path>\lib\cmake\Qt6，不可再追加后缀
          Qt6_DIR: ${{ steps.qt.outputs.qt_dir }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset win-x64-ci

      - name: Build
        run: cmake --build --preset win-x64-ci --parallel

      - name: Test
        run: ctest --preset win-x64-ci

  installer:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 同 build-and-test：build-installer.ps1 内的 cmake --preset(Ninja) 需要 cl/ninja/cmake 在 PATH。
      - name: Setup MSVC environment (vcvars)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          # 第6个CI缺陷（真机runner暴露）：jrsoftware.org/download.php/is.exe 对 GitHub runner
          # 数据中心 IP 常被限流/不可达，Invoke-WebRequest 在 2s 内 exit 1，导致 installer job
          # 失败、service-smoke 被 skipped（run #2 实测）。改用 runner 预装的 Chocolatey 安装，
          # 来源稳定；Inno Setup 6 装到标准路径 ${ProgramFiles(x86)}\Inno Setup 6\ISCC.exe，
          # build-installer.ps1 的 Get-Command iscc / 已知路径回退可直接定位（无需 $env:ISCC）。
          choco install innosetup -y --no-progress
          # 将 Inno Setup 6 目录写入 GITHUB_PATH，使后续步骤 build-installer.ps1 的 Get-Command iscc 直接命中
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path (Join-Path $inno 'ISCC.exe')) { Add-Content -Path $env:GITHUB_PATH -Value $inno }

      - name: Bootstrap vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          # 钉到 microsoft/vcpkg 官方 release 2026.07.29 的 commit（上游真实存在，且最接近本地验证版本）。
          # 注：此前误用了本地镜像 zip 内嵌的 hash，该 hash 在上游 microsoft/vcpkg 不存在（API 返回 422），
          # 导致 run-vcpkg 无法 checkout 而 Bootstrap vcpkg 步骤失败。
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          # 显式钉住克隆目录，与下面 Configure 步骤注入的 VCPKG_ROOT 保持一致（避免 action 默认值漂移）
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/out/build/win-x64-ci/vcpkg_installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      # 诊断探针：用不同退出码编码“缺失的工具”（匿名无法读日志，但 “Process completed
      # with exit code N” 注解可靠可见）：21=cl 22=cmake 23=vcpkg.cmake 24=Qt6_DIR 25=windeployqt 26=iscc。
      - name: Probe installer toolchain (distinct exit codes pinpoint missing tool)
        shell: pwsh
        env:
          Qt6_DIR: ${{ steps.qt.outputs.qt_dir }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $env:PATH = "${{ steps.qt.outputs.qt_bin }};" + $env:PATH
          $cl = (Get-Command cl.exe -ErrorAction SilentlyContinue).Source
          $cm = (Get-Command cmake -ErrorAction SilentlyContinue).Source
          $tc = Join-Path $env:VCPKG_ROOT 'scripts\buildsystems\vcpkg.cmake'
          Write-Host "qt_bin_output=${{ steps.qt.outputs.qt_bin }}"
          Write-Host "cl=$cl"
          Write-Host "cmake=$cm"
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT toolchain_exists=$(Test-Path $tc)"
          Write-Host "Qt6_DIR=$env:Qt6_DIR"
          if (-not $cl) { Write-Host "::error::MISSING cl.exe"; exit 21 }
          if (-not $cm) { Write-Host "::error::MISSING cmake"; exit 22 }
          if (-not (Test-Path $tc)) { Write-Host "::error::MISSING vcpkg.cmake at $tc"; exit 23 }
          if (-not $env:Qt6_DIR) { Write-Host "::error::MISSING Qt6_DIR"; exit 24 }
          $qtBin = Join-Path (Split-Path (Split-Path (Split-Path $env:Qt6_DIR))) 'bin'
          $wd = @(Get-ChildItem -Path $qtBin -Filter 'windeployqt*.exe' -ErrorAction SilentlyContinue)
          $wdc = (Get-Command windeployqt.exe,windeployqt6.exe -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          Write-Host "qtBin_derived=$qtBin windeployqt_in_qtBin=$(($wd.Name) -join ',') windeployqt_on_PATH=$wdc"
          if ($wd.Count -eq 0 -and -not $wdc) { Write-Host "::error::MISSING windeployqt (qtBin=$qtBin)"; exit 25 }
          $ipaths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe","$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe","C:\ProgramData\chocolatey\lib\innosetup\tools\ISCC.exe")
          foreach ($p in $ipaths) { Write-Host "iscc_check $p => $(Test-Path $p)" }
          Get-ChildItem 'C:\Program Files (x86)','C:\Program Files' -Directory -Filter 'Inno*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "inno_dir=$($_.FullName)" }
          $icmd = (Get-Command iscc.exe,iscc -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          $ifound = $ipaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "iscc_on_PATH=$icmd iscc_found_path=$ifound"
          if (-not $ifound -and -not $icmd) { Write-Host "::error::MISSING iscc"; exit 26 }
          Write-Host "ALL_INSTALLER_TOOLS_PRESENT"

      - name: Build installer (windeployqt + Inno)
        shell: pwsh
        env:
          Qt6_DIR: ${{ steps.qt.outputs.qt_dir }}
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          # windeployqt 位于 qt_bin；入 PATH 后 build-installer.ps1 能直接定位
          echo "${{ steps.qt.outputs.qt_bin }}" >> $env:GITHUB_PATH
          $env:PATH = "${{ steps.qt.outputs.qt_bin }};" + $env:PATH
          .\scripts\build-installer.ps1 -Preset win-x64-ci

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hwpanel-setup
          path: out/packages/*.exe

  service-smoke:
    # M3/M6 运行时验收：windows-latest runner 具备管理员权限，可真实注册/恢复/卸载服务
    needs: installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: hwpanel-setup
          path: out/packages

      - name: Install via setup (M6 install path, registers + starts service)
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'out\packages\*.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait

      - name: M3 service smoke (running/eventlog/recover<=30s/pause/continue)
        shell: pwsh
        run: .\scripts\smoke-service.ps1

      - name: Uninstall via setup (M6 cleanup path) + residue assert
        shell: pwsh
        run: |
          $un = Get-ChildItem "$env:ProgramFiles\HWPanel\unins000.exe","${env:ProgramFiles(x86)}\HWPanel\unins000.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $un) { throw 'uninstaller not found' }
          Start-Process $un.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          if (Get-Service HWPanelService -ErrorAction SilentlyContinue) { throw 'service residue after uninstall' }
          Write-Host 'uninstall clean'
